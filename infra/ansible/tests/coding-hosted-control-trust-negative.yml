---
- name: Require rejection by the real validator trust guard
  vars:
    validator_stack_coding_hosted_control_enabled: true
    validator_stack_coding_hosted_platform_hotkey: "{{ item }}"
  block:
    - ansible.builtin.import_tasks: ../roles/validator_stack/tasks/coding_hosted_trust.yml
    - name: Fail if invalid validator trust was accepted
      ansible.builtin.fail:
        msg: Invalid synthetic Platform control hotkey passed the validator trust guard.
  rescue:
    - name: Verify the intended validator trust guard refused
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name == 'Require a distinct public Platform control signer hotkey'
        quiet: true
