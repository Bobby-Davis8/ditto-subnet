---
# Freeze the enabled gate exactly once, in a no_log task with no loop variable
# in scope. ansible re-templates a variable on every read, so a lazily templated
# extra var such as `-e '{"..._enabled": "{{ item is defined }}"}'` evaluates
# false here and true inside a write loop; a block-level `when` is pushed down to
# every child task and re-evaluated with the loop variable in scope, which is
# the #1888 flip. Freezing to a plain bool defeats that, `default(false, true)`
# turns an undefined-class template error into false, and no_log censors the
# fatal result. The enabled branch runs through a dynamic include_tasks, which
# --start-at-task cannot jump into, so the guards cannot be skipped. Residual: a
# lookup/filter plugin error in the enabled input still prints its own value in
# ansible's finalization banner on 2.21.2 (see docs); the run writes nothing.
- name: Freeze the enabled gate once
  ansible.builtin.set_fact:
    coding_hosted_worker_credentials_gate: >-
      {{ (coding_hosted_worker_credentials_enabled | default(false, true)) | bool }}
  no_log: true

- name: Explain dormant native worker credential materialization
  ansible.builtin.debug:
    msg: Native Coding worker credential materialization is disabled; no credential file is written.
  when: not coding_hosted_worker_credentials_gate

- name: Materialize the worker-owned credential files behind the enabled gate
  ansible.builtin.include_tasks: materialize.yml
  when: coding_hosted_worker_credentials_gate
