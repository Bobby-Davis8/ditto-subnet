---
# One shared idle-unit rule for this role, included by every liveness check so
# the allow-list regex is defined once. Caller passes idle_units_listing (the
# systemctl stdout_lines) and idle_units_fail_msg (a constant, value-free
# message). Allow-list, not deny-list: every listed line must be an expected
# unit whose ACTIVE column is inactive or failed. Any other state, including
# refreshing (systemd 256+), maintenance, a future state or an unparseable
# line, refuses. An empty listing means no such unit is loaded and is allowed.
# NB: a cross-branch shared definition with #1909's idle_units is not yet
# possible; keep this in parity with that by hand until they can share a file.
- name: Require every listed worker or custody unit to be inactive or failed
  ansible.builtin.assert:
    that:
      - >-
        idle_units_listing
        | reject('match', '^(ditto-coding-hosted-worker[.]service|ditto-coding-custody@\\S+[.]service)\\s+\\S+\\s+(inactive|failed)(\\s|$)')
        | list | length == 0
    fail_msg: "{{ idle_units_fail_msg }}"
    quiet: true
