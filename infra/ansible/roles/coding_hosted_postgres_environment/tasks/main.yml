---
# The gate is decided exactly once, here, and never again. include_tasks is a
# dynamic include, so its when: is evaluated a single time with no loop item in
# scope. This closes three bypasses at once:
#   * a lazily templated flag such as '{{ item is defined }}', which is false
#     with no item here and could otherwise flip to true inside a later loop;
#   * --start-at-task, which cannot jump into a file the runtime has not yet
#     included and therefore cannot skip the guards to reach the write;
#   * a flag whose template errors while reading a secret: default(false, true)
#     turns any such error into false without surfacing the value.
- name: Materialize the native PostgreSQL environment only when explicitly enabled
  ansible.builtin.include_tasks: materialize.yml
  when: (coding_hosted_postgres_environment_enabled | default(false, true)) | bool

- name: Explain dormant native PostgreSQL environment materialization
  ansible.builtin.debug:
    msg: Native Coding PostgreSQL environment materialization is disabled; no credential file is written.
  when: not ((coding_hosted_postgres_environment_enabled | default(false, true)) | bool)
