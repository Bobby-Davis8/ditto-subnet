---
# Reached only through the single, loop-item-free gate in main.yml, so every
# guard below runs exactly once, before any copy is written, and reads only
# values this run produced.

# Extra vars outrank role defaults, registered results and set_facts alike, so
# the only defence against a preset internal name is to refuse it before that
# name is created. varnames is checked here, before any register or set_fact,
# so at this point only the four documented inputs may carry the role's prefix:
# a preset registered result, captured value or document variable would show up
# and is refused. The separate removal role's coding_hosted_postgres_environment_cleanup_*
# names are excluded so its presence never produces a misleading refusal here.
- name: Refuse a password supplied as an Ansible variable
  ansible.builtin.assert:
    that:
      - coding_hosted_postgres_environment_password is not defined
    fail_msg: >-
      Never pass the PostgreSQL password with -e, inventory or vars files. Export
      DITTO_CODING_PG_PASSWORD in the controller's local environment instead.
    quiet: true

- name: Refuse preset registered results and undocumented role inputs
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.varnames', '^coding_hosted_postgres_environment_', wantlist=True)
        | reject('match', '^coding_hosted_postgres_environment_cleanup_')
        | sort == ['coding_hosted_postgres_environment_confirmation',
        'coding_hosted_postgres_environment_enabled',
        'coding_hosted_postgres_environment_host',
        'coding_hosted_postgres_environment_source_revision']
    fail_msg: >-
      Only the enabled, confirmation, source_revision and host inputs are accepted; a
      registered result name, a captured or document variable, or another
      coding_hosted_postgres_environment_ variable is preset. Nothing was written.
    quiet: true

# A -e ansible_facts value replaces gathered facts, so identity and the reader
# accounts come only from these registered probes, whose names the guard above
# keeps unforgeable.
- name: Probe this machine's identity into a result extra vars cannot preset
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', platform, distribution]
  register: coding_hosted_postgres_environment_identity

- name: Inspect host accounts once
  ansible.builtin.getent:
    database: passwd
  register: coding_hosted_postgres_environment_accounts

# Capture every operator input exactly once, with no loop item in scope, so a
# lazily templated value cannot render one thing here and another inside a
# later loop. default(..., true) turns any template error, including one that
# reads the password, into an empty string that then fails validation, instead
# of surfacing the value in a fatal error message. no_log keeps a value that
# resolved to a secret off the wire. Every later task uses only these captures.
- name: Capture the operator inputs once, neutralising templates and loops
  ansible.builtin.set_fact:
    coding_hosted_postgres_environment_captured_host: "{{ coding_hosted_postgres_environment_host | default('', true) }}"
    coding_hosted_postgres_environment_captured_confirmation: "{{ coding_hosted_postgres_environment_confirmation | default('', true) }}"
    coding_hosted_postgres_environment_captured_revision: "{{ coding_hosted_postgres_environment_source_revision | default('', true) }}"
  no_log: true

# A single trailing newline satisfies a '$' anchor, so the revision also needs
# its exact length and the host must survive trimming unchanged. The captured
# values are inert strings by now, so this assert cannot render an operator
# template and quiet keeps the conditions, which name only variables, terse.
- name: Require the exact host, source, database address and confirmation
  ansible.builtin.assert:
    that:
      - inventory_hostname in groups.get('role_coding_hosted', [])
      - coding_hosted_postgres_environment_identity.ansible_facts.ansible_hostname == 'ditto-coding-hosted-v2'
      - coding_hosted_postgres_environment_identity.ansible_facts.ansible_architecture == 'x86_64'
      - coding_hosted_postgres_environment_identity.ansible_facts.ansible_distribution == 'Debian'
      - coding_hosted_postgres_environment_identity.ansible_facts.ansible_distribution_major_version == '13'
      - coding_hosted_postgres_environment_captured_revision is string
      - coding_hosted_postgres_environment_captured_revision is match('^[0-9a-f]{40}$')
      - coding_hosted_postgres_environment_captured_revision | length == 40
      - coding_hosted_postgres_environment_captured_confirmation == 'MATERIALIZE NATIVE CODING POSTGRES ENVIRONMENT'
      - coding_hosted_postgres_environment_captured_host is string
      - coding_hosted_postgres_environment_captured_host == coding_hosted_postgres_environment_captured_host | trim
      - coding_hosted_postgres_environment_captured_host is match('^10[.]30[.]0[.]([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-3])$')
    fail_msg: Require the reviewed source, dedicated host, exact PostgreSQL private IP and confirmation.
    quiet: true

- name: Require one bounded single-line password from the controller environment
  ansible.builtin.assert:
    that:
      - lookup('env', 'DITTO_CODING_PG_PASSWORD') | length > 0
      - lookup('env', 'DITTO_CODING_PG_PASSWORD') | length <= 1024
      - lookup('env', 'DITTO_CODING_PG_PASSWORD') == lookup('env', 'DITTO_CODING_PG_PASSWORD') | trim
      - lookup('env', 'DITTO_CODING_PG_PASSWORD') is not search('[\x00-\x1f\x7f]')
    fail_msg: >-
      Export DITTO_CODING_PG_PASSWORD from the platform-db-password secret in the
      controller's local environment and re-run. The value is never printed.
    quiet: true
  no_log: true

- name: Require the distinct worker and custodian identities
  ansible.builtin.assert:
    that:
      - coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd.get('ditto-coding-hosted') is not none
      - coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd.get('ditto-coding-custody') is not none
      - coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd['ditto-coding-hosted'][1] != coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd['ditto-coding-custody'][1]
      - coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd['ditto-coding-hosted'][4] == '/var/lib/ditto-coding-hosted'
      - coding_hosted_postgres_environment_accounts.ansible_facts.getent_passwd['ditto-coding-custody'][4] == '/var/lib/ditto-coding-custody'
    fail_msg: Run the native daemon and custody-key bootstraps before materializing credentials.
    quiet: true

- name: List live worker and custody units
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, list-units, --all, --plain, --no-legend, --full, ditto-coding-hosted-worker.service, "ditto-coding-custody@*.service"]
  register: coding_hosted_postgres_environment_units
  changed_when: false
  check_mode: false

# Allow-list, not deny-list: every listed line must be an expected unit whose
# ACTIVE column is inactive or failed. Any other state, including refreshing
# (systemd 256+), maintenance, a future state or an unparseable line, refuses.
# An empty listing means no such unit is loaded and is allowed.
- name: Refuse to replace credentials unless every listed unit is inactive or failed
  ansible.builtin.assert:
    that:
      - >-
        coding_hosted_postgres_environment_units.stdout_lines
        | reject('match', '^(ditto-coding-hosted-worker[.]service|ditto-coding-custody@\\S+[.]service)\\s+\\S+\\s+(inactive|failed)(\\s|$)')
        | list | length == 0
    fail_msg: >-
      Stop the hosted worker and every custody instance before materializing credentials;
      each listed unit must be inactive or failed and this role stops nothing.
    quiet: true

# Render the entries and the password-bearing document once, from the captured,
# validated host, so the bytes written and the digest verified are built from
# the same single render and no operator template reaches this point.
- name: Assemble the fixed environment entries from the captured host
  ansible.builtin.set_fact:
    coding_hosted_postgres_environment_entries:
      - "POSTGRES_HOST={{ coding_hosted_postgres_environment_captured_host }}"
      - "POSTGRES_PORT=5432"
      - "POSTGRES_USER=ditto"
      - "POSTGRES_DB=ditto_platform_prod"
      - "POSTGRES_COMMAND_TIMEOUT=30"
      - "POSTGRES_POOL_MIN_SIZE=1"
      - "POSTGRES_POOL_MAX_SIZE=4"
  no_log: true

- name: Render the environment document once with the controller-only password
  ansible.builtin.set_fact:
    coding_hosted_postgres_environment_document: >-
      {{ (coding_hosted_postgres_environment_entries
      + ['POSTGRES_PASSWORD=' ~ lookup('env', 'DITTO_CODING_PG_PASSWORD')])
      | to_json }}
  no_log: true

- name: Create owner-only credential directories for each reader
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0700"
  loop:
    - {path: /var/lib/ditto-coding-custody/private, owner: ditto-coding-custody}
    - {path: /var/lib/ditto-coding-hosted/private, owner: ditto-coding-hosted}
  loop_control:
    label: "{{ item.path }}"

- name: Write each reader's own PostgreSQL environment copy without printing it
  ansible.builtin.copy:
    dest: "{{ item.path }}"
    content: "{{ coding_hosted_postgres_environment_document }}"
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0600"
  loop:
    - {path: /var/lib/ditto-coding-custody/private/postgres-environment.json, owner: ditto-coding-custody}
    - {path: /var/lib/ditto-coding-hosted/private/postgres-environment.json, owner: ditto-coding-hosted}
  loop_control:
    label: "{{ item.path }}"
  no_log: true
  diff: false

# A unit could start between the pre-write listing and now, so a copy may have
# been written and read mid-rotation. Re-list and refuse loudly if so; the role
# stops nothing and does not roll the copy back.
- name: Re-list live worker and custody units after writing
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, list-units, --all, --plain, --no-legend, --full, ditto-coding-hosted-worker.service, "ditto-coding-custody@*.service"]
  register: coding_hosted_postgres_environment_units_after_write
  changed_when: false
  check_mode: false

- name: Refuse if any unit became active during the write
  ansible.builtin.assert:
    that:
      - >-
        coding_hosted_postgres_environment_units_after_write.stdout_lines
        | reject('match', '^(ditto-coding-hosted-worker[.]service|ditto-coding-custody@\\S+[.]service)\\s+\\S+\\s+(inactive|failed)(\\s|$)')
        | list | length == 0
    fail_msg: >-
      A worker or custody unit became active during the write; a copy may have been read
      mid-rotation. Stop every unit, reconcile by hand and re-run.
    quiet: true

- name: Reinspect both copies as ownership, mode and digest metadata only
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
  loop:
    - {path: /var/lib/ditto-coding-custody/private/postgres-environment.json, owner: ditto-coding-custody}
    - {path: /var/lib/ditto-coding-hosted/private/postgres-environment.json, owner: ditto-coding-hosted}
  loop_control:
    label: "{{ item.path }}"
  register: coding_hosted_postgres_environment_files
  no_log: true

# no_log: the loop item is a whole stat result, so without it item.stat.checksum
# (the document's SHA-256, enough for offline password guessing) would print on
# failure and with -v.
- name: Require owner-only regular single-link copies
  ansible.builtin.assert:
    that:
      - item.stat.isreg | default(false)
      - not item.stat.islnk
      - item.stat.pw_name == item.item.owner
      - item.stat.mode == '0600'
      - item.stat.nlink == 1
      - item.stat.size > 0
    fail_msg: A PostgreSQL environment copy is not sealed to its reader.
    quiet: true
  loop: "{{ coding_hosted_postgres_environment_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Require both copies to hold exactly the rendered document
  ansible.builtin.assert:
    that:
      - item.stat.checksum == coding_hosted_postgres_environment_document | hash('sha256')
    fail_msg: A PostgreSQL environment copy does not match the rendered document.
    quiet: true
  loop: "{{ coding_hosted_postgres_environment_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  no_log: true

- name: Re-list live worker and custody units after verifying
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, list-units, --all, --plain, --no-legend, --full, ditto-coding-hosted-worker.service, "ditto-coding-custody@*.service"]
  register: coding_hosted_postgres_environment_units_after_verify
  changed_when: false
  check_mode: false

- name: Refuse if any unit became active during verification
  ansible.builtin.assert:
    that:
      - >-
        coding_hosted_postgres_environment_units_after_verify.stdout_lines
        | reject('match', '^(ditto-coding-hosted-worker[.]service|ditto-coding-custody@\\S+[.]service)\\s+\\S+\\s+(inactive|failed)(\\s|$)')
        | list | length == 0
    fail_msg: >-
      A worker or custody unit became active while verifying the copies; a copy may have
      been read mid-rotation. Stop every unit, reconcile by hand and re-run.
    quiet: true

- name: Report only that the copies exist
  ansible.builtin.debug:
    msg: >-
      Native Coding PostgreSQL environment materialized for the custodian and
      worker; owner, mode and digest verified; values and digest not shown;
      shadow_only=true; weight_eligible=false; services_started=false.
