---
# Materialize the native Coding worker's Hippius, image storage and provider
# credential files. This is a separate protected convergence: the operator
# retrieves each secret himself and exports it only in the controller shell that
# runs this playbook; no workflow identity, role or task touches Secret Manager
# or IAM. It writes three files only; it starts nothing. See
# infra/docs/coding-hosted-worker-credentials-v2.md for the inputs and procedure.
#
#   GCP_OSLOGIN_USER=… ansible-playbook -i infra/ansible/inventory/gcp.yml \
#     infra/ansible/playbooks/gcp-coding-hosted-worker-credentials.yml \
#     --limit ditto-coding-hosted-v2 -e '{"coding_hosted_worker_credentials_enabled": true, …}'
#   unset DITTO_CODING_WORKER_…   # every exported input
- name: Materialize native Coding worker credential files without starting a service
  hosts: role_coding_hosted
  become: true
  # Identity comes from the role's registered probes, which extra vars cannot
  # preset; gathered facts would be replaced by a -e ansible_facts value.
  gather_facts: false
  vars:
    # The SSH connection plugin reads pipelining from this var (as well as the
    # repo ansible.cfg ini setting). Setting it here genuinely turns pipelining
    # on for the run AND lets the role's guard confirm it, so the module carrying
    # the credentials is streamed over stdin, never written to the host's remote
    # temp directory. A later-precedence `-e ansible_pipelining=false` or
    # `-e ansible_ssh_pipelining=false` both turn it off and are refused by the
    # role.
    ansible_pipelining: true
  roles:
    - coding_hosted_worker_credentials
