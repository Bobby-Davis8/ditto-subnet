---
# Remove only the native Coding worker's three credential files, for rollback or
# as a step of the rotation in infra/docs/coding-hosted-worker-credentials-v2.md.
# Removal is not revocation: every credential stays valid at its issuer until
# the operator revokes or rotates it there. It needs no secret: do not export
# any DITTO_CODING_WORKER_* input for it. It stops nothing, so stop the worker
# and every custody instance first.
#
#   GCP_OSLOGIN_USER=… ansible-playbook -i infra/ansible/inventory/gcp.yml \
#     infra/ansible/playbooks/gcp-coding-hosted-worker-credentials-cleanup.yml \
#     --limit ditto-coding-hosted-v2 -e '{"coding_hosted_worker_credentials_cleanup_enabled": true, …}'
- name: Remove native Coding worker credential files without stopping a service
  hosts: role_coding_hosted
  become: true
  # Identity comes from the role's registered probe, which extra vars cannot
  # preset; gathered facts would be replaced by a -e ansible_facts value.
  gather_facts: false
  roles:
    - coding_hosted_worker_credentials_cleanup
