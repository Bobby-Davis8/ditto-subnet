---
# Remove only the native Coding host's two PostgreSQL environment copies. This is
# a separate protected operation for rollback or before re-materializing a new
# password. It needs no secret: do not export DITTO_CODING_PG_PASSWORD for it.
# It stops nothing, so stop the worker and every custody instance first.
#
#   GCP_OSLOGIN_USER=… ansible-playbook -i infra/ansible/inventory/gcp.yml \
#     infra/ansible/playbooks/gcp-coding-hosted-postgres-environment-cleanup.yml \
#     --limit ditto-coding-hosted-v2 -e '{"coding_hosted_postgres_environment_cleanup_enabled": true, …}'
- name: Remove native Coding PostgreSQL environment copies without stopping a service
  hosts: role_coding_hosted
  become: true
  gather_facts: true
  roles:
    - coding_hosted_postgres_environment_cleanup
